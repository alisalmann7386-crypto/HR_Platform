name: Python checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build semantic policy index in fresh checkout
        run: python scripts/build_policy_index.py --input data/policies
      - name: Verify model and index in fresh checkout
        run: python scripts/check_deployment.py
      - name: Run full suite and evaluation commands
        run: |
          python -m pytest -q
          python scripts/evaluate_recruitment.py --backend semantic
          python scripts/evaluate_policy.py --top-k 5
          python scripts/evaluate_calibration.py
      - name: Check syntax
        run: python -m compileall -q app.py pages src scripts
